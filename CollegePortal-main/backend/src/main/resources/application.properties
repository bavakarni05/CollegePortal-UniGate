spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:unigate}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
#spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
cloudinary.url=${CLOUDINARY_URL:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.open-in-view=false

# Server port
server.port=${PORT:8082}

# Context path
server.servlet.context-path=/

# JWT settings
jwt.secret=${JWT_SECRET:testsecret}
jwt.expiration-ms=86400000

# Multipart file settings
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=15MB
